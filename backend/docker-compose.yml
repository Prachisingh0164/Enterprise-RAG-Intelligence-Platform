services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U rag"], interval: 5s, retries: 10}
  qdrant:
    image: qdrant/qdrant
    volumes: [qdrant:/qdrant/storage]
    ports: ["6333:6333"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://rag:rag@db:5432/rag
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: ${JWT_SECRET:-change-me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBED_BACKEND: ${EMBED_BACKEND:-hash}
    command: sh -c "python -m rag.seed --if-empty && uvicorn rag.api:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}, qdrant: {condition: service_started}}
  dashboard:
    build: ../frontend
    environment: {API_URL: "http://api:8000"}
    ports: ["8501:8501"]
    depends_on: [api]
  prometheus:
    image: prom/prometheus
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
volumes: {pgdata: {}, qdrant: {}}
